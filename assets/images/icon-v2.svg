<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Expyr app icon, version 2. Not in use: app.json still points at icon.png.

    The sheet of paper with the corner turned is version 1, kept because it is
    the thing the app is about. What is new is what is written on it: three
    runways, the same drawing the document screen uses, showing three documents
    at three distances from their date.

    Every colour is from src/constants/theme.ts, with one deliberate exception.
    The track on screen is `border` #E2DCD0, which is a hairline on paper and
    is meant to be almost invisible there. At forty points it stops existing
    altogether, so the track here is one step darker. Every other colour is
    literal.

    The three bars are the three urgency colours the Timeline itself uses, in
    the order a document passes through them: textTertiary while there is time,
    urgentSoft as the date approaches, urgentStrong once it is on top of you.
    So the icon is not merely styled like the app, it is showing three real
    states of the thing the app exists to watch.
  -->

  <rect width="1024" height="1024" fill="#1D4B39"/>

  <!-- The sheet, and the turned corner. -->
  <path d="M196 150 H678 L828 300 V890 H196 Z" fill="#F7F4EF"/>
  <path d="M678 150 L828 300 H678 Z" fill="#E2DCD0"/>

  <!-- Time in hand. -->
  <rect x="286" y="378" width="452" height="44" rx="22" fill="#CFC6B6"/>
  <rect x="286" y="378" width="136" height="44" rx="22" fill="#918B7E"/>
  <circle cx="422" cy="400" r="40" fill="#918B7E" stroke="#F7F4EF" stroke-width="11"/>

  <rect x="286" y="498" width="452" height="44" rx="22" fill="#CFC6B6"/>
  <rect x="286" y="498" width="262" height="44" rx="22" fill="#87591A"/>
  <circle cx="548" cy="520" r="40" fill="#87591A" stroke="#F7F4EF" stroke-width="11"/>

  <!-- Due soon, above. Out of time, here. -->
  <rect x="286" y="618" width="452" height="44" rx="22" fill="#CFC6B6"/>
  <rect x="286" y="618" width="380" height="44" rx="22" fill="#9E2B20"/>
  <circle cx="666" cy="640" r="40" fill="#9E2B20" stroke="#F7F4EF" stroke-width="11"/>
</svg>
